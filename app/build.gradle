plugins {
    id 'com.android.application' version '8.0.2' apply false
}

android {
    namespace 'com.example.eli'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.eli"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
